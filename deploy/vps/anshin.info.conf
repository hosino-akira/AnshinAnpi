server {
    listen 80;
    server_name anshin.info;
    return 301 https://anshin.info$request_uri;
}

server {
    listen 443 ssl;
    server_name anshin.info;
    ssl_certificate /etc/nginx/ssl/anshin.info/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/anshin.info/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    location = / {
        return 302 /admin;
    }

    location /api/admin/ {
        proxy_pass http://127.0.0.1:3001/v1/admin/;
    }

    location /v1/ {
        proxy_pass http://127.0.0.1:3001;
    }

    location /health/ {
        proxy_pass http://127.0.0.1:3001;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
