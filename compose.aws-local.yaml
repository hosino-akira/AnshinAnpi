# ローカル開発専用。compose.yaml と併用し、認証情報はイメージへコピーしません。
services:
  api:
    environment:
      AWS_CONFIG_FILE: /home/node/.aws/config
      AWS_LOGIN_CACHE_DIRECTORY: /home/node/.aws/login/cache
    volumes:
      - type: bind
        source: ${USERPROFILE:?USERPROFILE を設定してください}/.aws/config
        target: /home/node/.aws/config
        read_only: true
        bind:
          create_host_path: false
      # ログイン処理が更新後のトークンをこのキャッシュへ書き戻します。
      - type: bind
        source: ${USERPROFILE:?USERPROFILE を設定してください}/.aws/login/cache
        target: /home/node/.aws/login/cache
        bind:
          create_host_path: false